title: Pagina

tabs:
  content:
    label: Contenuto
    icon: text
    fields:
      layout:
        label: Layout pagina
        type: layout
        layouts:
          - "1/1"
          - "1/2, 1/2"
          - "1/3, 2/3"
          - "2/3, 1/3"
          - "1/3, 1/3, 1/3"
          - "1/4, 3/4"
          - "3/4, 1/4"
          - "1/4, 1/4, 1/4, 1/4"
        settings:
          fields:
            theme:
              label: Tema sezione
              type: select
              default: light
              empty: false
              options:
                light: Sfondo bianco / testo nero
                dark: Sfondo nero / testo bianco
        fieldsets:
          - orma-page-opening
          - orma-heading
          - orma-large-text
          - orma-text
          - orma-image
          - orma-gallery
          - orma-archive-grid
          - orma-spacer

  subpages:
    label: Sottopagine e File
    icon: layers
    columns:
      - width: 1/2
        fields:
          pages:
            label: Sottopagine
            type: pagelist
            templates:
              - progetto
              - default
      - width: 1/2
        fields:
          files:
            label: File della pagina
            type: filelist
