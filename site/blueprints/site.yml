  settings:
    label: Impostazioni
    icon: cog
    fields:
      logo:
        label: Logo del sito
        type: filepicker
        multiple: false
        uploads: logo
        help: Carica il logo che compare nell'header del sito (SVG, PNG, JPG o WebP).
